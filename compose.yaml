
services:
  bike-theft-geo:
    build:
      context: .
      dockerfile: Dockerfile.geo
    image: bicycle-theft-geo:latest
    volumes:
      - ./data/geography:/app/data/geography
      - ./reports:/app/reports

  bike-theft-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: bicycle-theft-intelligence:latest

    depends_on:
      bike-theft-geo:
        condition: service_completed_successfully

    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./:/workspace

    command:
      - sh
      - -c
      - |
        python -m pytest -q &&
        python -m pipeline.build \
          --db /workspace/warehouse.duckdb \
          --report /app/reports/report.html
