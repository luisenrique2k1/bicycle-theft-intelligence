
name: Bicycle Theft Monthly Ingestion

on:
  schedule:
    - cron: '0 8 15 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bicycle-theft-monthly-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Monthly Data Ingestion
    runs-on: ubuntu-latest

    steps:
     - name: Checkout repository
       uses: actions/checkout@v7
       with:
          ref: main
          fetch-depth: 0

     - name: Set up Python
       uses: actions/setup-python@v6
       with:
          python-version: '3.12'
          cache: pip

     - name: Install dependencies
       run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

     - name: Verify ingestion environment
       run: |
          python -m pytest -q
          echo "Monthly ingestion environment ready"

     - name: Fetch latest published bicycle theft data
       run: |
          python -m pipeline.fetch --latest

     - name: Validate DuckDB warehouse and data quality
       run: |
          python -c "from pathlib import Path; from pipeline.build import build; build(Path('data/raw'), 'warehouse.duckdb', None)"

     - name: Build and test dbt transformations
       env:
          BIKE_THEFT_RAW_PATH: ${{ github.workspace }}/data/raw/*/*.json
          BIKE_THEFT_DB_PATH: ${{ runner.temp }}/bike_theft_monthly.duckdb
       run: |
          dbt build --project-dir dbt_bike_theft --profiles-dir dbt_bike_theft

     - name: Commit newly downloaded crime data
       run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/ data/manifest.csv

          if git diff --cached --quiet; then
            echo "No new crime data to commit"
          else
            git commit -m "data: update bicycle theft records"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
           