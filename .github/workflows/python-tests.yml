name: Bicycle Theft Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      
      - name: Run Python tests
        run: python -m pytest -q

      - name: Validate DuckDB SQL transformations and data quality
        run: |
          python -c "from pathlib import Path; from pipeline.build import build; con = build(Path('tests/fixtures/raw'), ':memory:', None); con.close()"

  docker:
    name: Validate Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker images
        run: docker compose build

      - name: Run Python tests inside Docker
        run: |
          docker compose run --rm --no-deps \
            bike-theft-pipeline python -m pytest -q

      - name: Validate SQL transformations inside Docker
        run: |
          docker compose run --rm --no-deps \
            bike-theft-pipeline python -c \
            "from pathlib import Path; from pipeline.build import build; con = build(Path('tests/fixtures/raw'), ':memory:', None); con.close()"