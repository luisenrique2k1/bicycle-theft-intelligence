name: Bicycle Theft Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      
      - name: Run Python tests
        run: python -m pytest -q

      - name: Validate DuckDB SQL transformations and data quality
        run: |
          python -c "from pathlib import Path; from pipeline.build import build; con = build(Path('tests/fixtures/raw'), ':memory:', None); con.close()"
